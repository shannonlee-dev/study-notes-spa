name: 저장소 검증

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 문서와 재현 절차 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 잠금 파일로 의존성 설치
        run: npm ci
      - name: 문법과 문서 검사
        run: make check
      - name: 배포용 빌드 확인
        run: make build
      - name: 노트 저장소 회귀 테스트
        run: make test
